<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LogiLightShow four-zone polygon acceptance pattern</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      main,
      svg {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      main {
        background: #000;
      }
      .zone {
        /* Deliberately no fill transition: the engine supplies the 90 ms fade. */
        shape-rendering: crispEdges;
      }
      .boundary {
        fill: none;
        stroke: #202020;
        stroke-width: 4;
        stroke-dasharray: 12 12;
        vector-effect: non-scaling-stroke;
        animation: march 500ms linear infinite;
      }
      .label {
        fill: #202020;
        font: 700 34px/1 system-ui, sans-serif;
        text-anchor: middle;
        dominant-baseline: middle;
        pointer-events: none;
        user-select: none;
      }
      aside {
        position: fixed;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
        max-width: 38rem;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        background: rgb(0 0 0 / 80%);
        color: white;
        font: 600 1rem/1.4 system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      @keyframes march {
        to { stroke-dashoffset: -24; }
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        viewBox="0 0 1000 1000"
        preserveAspectRatio="none"
        role="img"
        aria-label="Continuously changing four-polygon G560 lighting test"
      >
        <!-- Exact normalized ZoneLayout::g560_default() vertices, scaled by 1000. -->
        <polygon class="zone" id="left-rear" points="0,0 500,0 170,700 140,1000 0,1000" />
        <polygon class="zone" id="left-front" points="500,0 500,1000 140,1000 170,700" />
        <polygon class="zone" id="right-front" points="500,0 830,700 860,1000 500,1000" />
        <polygon class="zone" id="right-rear" points="500,0 1000,0 1000,1000 860,1000 830,700" />

        <path class="boundary" d="M 500,0 L 170,700 L 140,1000 M 500,0 L 500,1000 M 500,0 L 830,700 L 860,1000" />
        <text class="label" x="205" y="315">LEFT REAR</text>
        <text class="label" x="365" y="780">LEFT FRONT</text>
        <text class="label" x="635" y="780">RIGHT FRONT</text>
        <text class="label" x="795" y="315">RIGHT REAR</text>
      </svg>
    </main>
    <aside>
      Press F11 for full screen. Polygon colors snap once per second so the G560's
      90 ms fade is visible; one zone is always true black.
    </aside>
    <script>
      const zoneOrder = [
        document.querySelector("#left-rear"),
        document.querySelector("#left-front"),
        document.querySelector("#right-front"),
        document.querySelector("#right-rear"),
      ];
      const colors = ["#ff0000", "#00ff00", "#0055ff", "#000000"];
      let step = 0;

      function render() {
        zoneOrder.forEach((polygon, zone) => {
          polygon.style.fill = colors[(zone - step + colors.length) % colors.length];
        });
        step = (step + 1) % colors.length;
      }

      render();
      window.setInterval(render, 1000);
      window.setTimeout(() => document.querySelector("aside").remove(), 8000);
    </script>
  </body>
</html>
