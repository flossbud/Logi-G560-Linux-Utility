<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LogiLightShow four-zone acceptance pattern</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      main {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      main {
        display: grid;
        grid-template: 1fr 1fr / 1fr 1fr;
        background: #000;
      }
      .quadrant {
        transition: background-color 900ms linear;
      }
      #upper-left { grid-area: 1 / 1; }
      #upper-right { grid-area: 1 / 2; }
      #lower-left { grid-area: 2 / 1; }
      #lower-right { grid-area: 2 / 2; }
      aside {
        position: fixed;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
        max-width: 36rem;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        background: rgb(0 0 0 / 75%);
        color: white;
        font: 600 1rem/1.4 system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main aria-label="Continuously changing four-quadrant lighting test">
      <div class="quadrant" id="upper-left"></div>
      <div class="quadrant" id="upper-right"></div>
      <div class="quadrant" id="lower-left"></div>
      <div class="quadrant" id="lower-right"></div>
    </main>
    <aside>Press F11 for full screen. Colors rotate once per second; one quadrant is always true black.</aside>
    <script>
      const zoneOrder = [
        document.querySelector("#upper-left"),
        document.querySelector("#lower-left"),
        document.querySelector("#lower-right"),
        document.querySelector("#upper-right"),
      ];
      const colors = ["#ff0000", "#00ff00", "#0000ff", "#000000"];
      let step = 0;

      function render() {
        zoneOrder.forEach((quadrant, zone) => {
          quadrant.style.backgroundColor = colors[(zone - step + colors.length) % colors.length];
        });
        step = (step + 1) % colors.length;
      }

      render();
      window.setInterval(render, 1000);
      window.setTimeout(() => document.querySelector("aside").remove(), 8000);
    </script>
  </body>
</html>
